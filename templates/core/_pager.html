{% if page.has_other_pages %}
<nav class="pager">
  {% if page.has_previous %}<a class="btn btn-ghost btn-sm" href="?{{ params }}{% if params %}&{% endif %}page={{ page.previous_page_number }}">← Previous</a>{% endif %}
  <span class="muted small">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-ghost btn-sm" href="?{{ params }}{% if params %}&{% endif %}page={{ page.next_page_number }}">Next →</a>{% endif %}
</nav>
{% endif %}
